name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      # The release builds for every OS/arch; the host-only build above can miss
      # platform-specific code (e.g. syscall fields). Cross-compile the same
      # targets goreleaser does so a release-breaking compile error fails CI first.
      - name: Cross-compile release targets
        run: |
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              echo "build $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./... || exit 1
            done
          done

  crd-drift:
    name: Embedded CRDs in sync with butler-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout butler-cli
        uses: actions/checkout@v4
        with:
          path: butler-cli

      # butler-api is the single source of truth for the CRD schemas. butler-api is
      # public, so the default token can read it.
      - name: Checkout butler-api
        uses: actions/checkout@v4
        with:
          repository: butlerdotdev/butler-api
          path: butler-api

      - name: Re-sync embedded CRDs from butler-api
        working-directory: butler-cli
        run: BUTLER_API_PATH="$GITHUB_WORKSPACE/butler-api" ./hack/sync-crds.sh

      - name: Fail if the committed copies drifted
        working-directory: butler-cli
        run: |
          if ! git diff --exit-code internal/adm/bootstrap/manifests/crds/; then
            echo "::error::Embedded bootstrap CRDs are out of sync with butler-api." \
                 "Run 'make sync-crds' against an up-to-date butler-api checkout and commit the result." >&2
            exit 1
          fi
          echo "Embedded CRDs match butler-api."
