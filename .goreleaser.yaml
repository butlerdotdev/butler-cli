version: 2

project_name: butler

before:
  hooks:
    - go mod tidy
    - mkdir -p completions
    - go run ./cmd/butlerctl completion bash > completions/butlerctl.bash
    - go run ./cmd/butlerctl completion zsh > completions/_butlerctl
    - go run ./cmd/butlerctl completion fish > completions/butlerctl.fish
    - go run ./cmd/butleradm completion bash > completions/butleradm.bash
    - go run ./cmd/butleradm completion zsh > completions/_butleradm
    - go run ./cmd/butleradm completion fish > completions/butleradm.fish

builds:
  - id: butleradm
    binary: butleradm
    main: ./cmd/butleradm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/butlerdotdev/butler/internal/common/version.Version={{.Version}}
      - -X github.com/butlerdotdev/butler/internal/common/version.Commit={{.Commit}}
      - -X github.com/butlerdotdev/butler/internal/common/version.Date={{.Date}}

  - id: butlerctl
    binary: butlerctl
    main: ./cmd/butlerctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/butlerdotdev/butler/internal/common/version.Version={{.Version}}
      - -X github.com/butlerdotdev/butler/internal/common/version.Commit={{.Commit}}
      - -X github.com/butlerdotdev/butler/internal/common/version.Date={{.Date}}

archives:
  - id: butlerctl
    builds:
      - butlerctl
    name_template: "butlerctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - completions/butlerctl.*
      - completions/_butlerctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: butleradm
    builds:
      - butleradm
    name_template: "butleradm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - completions/butleradm.*
      - completions/_butleradm
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: butlerctl
    ids:
      - butlerctl
    repository:
      owner: butlerdotdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://butlerlabs.dev"
    description: "Butler tenant cluster CLI"
    install: |
      bin.install "butlerctl"
      bash_completion.install "completions/butlerctl.bash" => "butlerctl"
      zsh_completion.install "completions/_butlerctl"
      fish_completion.install "completions/butlerctl.fish"

  - name: butleradm
    ids:
      - butleradm
    repository:
      owner: butlerdotdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://butlerlabs.dev"
    description: "Butler platform administration CLI"
    install: |
      bin.install "butleradm"
      bash_completion.install "completions/butleradm.bash" => "butleradm"
      zsh_completion.install "completions/_butleradm"
      fish_completion.install "completions/butleradm.fish"

chocolateys:
  - name: butler-cli
    owners: butlerdotdev
    authors: Butler Labs
    project_url: https://butlerlabs.dev
    license_url: https://github.com/butlerdotdev/butler-cli/blob/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/butlerdotdev/butler-cli
    docs_url: https://docs.butler.dev
    bug_tracker_url: https://github.com/butlerdotdev/butler-cli/issues
    tags: "kubernetes platform-engineering cli"
    summary: Butler Platform Engineering CLI
    description: |
      Butler is a platform engineering toolkit that simplifies Kubernetes
      cluster management. Includes butleradm for cluster administration
      and butlerctl for day-to-day operations.
    release_notes: "https://github.com/butlerdotdev/butler-cli/releases/tag/v{{ .Version }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"

release:
  github:
    owner: butlerdotdev
    name: butler-cli
  draft: false
  prerelease: auto
