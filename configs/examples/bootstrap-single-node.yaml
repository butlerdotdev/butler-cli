# Butler Single-Node Bootstrap - Minimal single-node cluster for testing
provider: harvester

cluster:
  name: butler-sn-dev
  topology: single-node
  controlPlane:
    replicas: 1
    cpu: 4
    memoryMB: 8192
    diskGB: 50
    extraDisks:
      - sizeGB: 50

network:
  podCIDR: 10.244.0.0/16
  serviceCIDR: 10.96.0.0/12
  vip: 10.40.0.200
  loadBalancerPool:
    start: 10.40.0.221
    end: 10.40.0.230
  # Override the node NIC MTU when the cluster path traverses a sub-1500
  # tunnel (IPsec/NAT-T, VPN, ZTNA, SD-WAN). Cilium follows device MTU.
  # Omit for the Talos default (1500). Valid range 576-9000. Values
  # above 1500 (jumbo frames) also require jumboFrames: true after
  # verifying every hop on the end-to-end path supports the frame size
  # — a misconfigured jumbo path silently stalls large flows while
  # control traffic still succeeds.
  # mtu: 1380
  # jumboFrames: false

talos:
  version: v1.12.1
  schematic: dc7b152cb3ea99b821fcb7340ce7168313ce393d663740b791c36f6e95fc8586

addons:
  cni:
    type: cilium
  storage:
    type: longhorn
  loadBalancer:
    type: metallb
  gitOps:
    type: flux
  capi:
    enabled: true
    version: v1.9.4
  butlerController:
    enabled: true
    version: latest
    image: ghcr.io/butlerdotdev/butler-controller
  console:
    enabled: true
    version: "0.1.0"
    ingress:
      enabled: true
      host: butler.sn.local
      className: traefik
      tls: false

providerConfig:
  harvester:
    kubeconfigPath: ~/.butler/harvester-kubeconfig
    namespace: default
    networkName: default/vlan40-workloads
    imageName: default/image-5rs6d
